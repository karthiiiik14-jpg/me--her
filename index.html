<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Background Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .song-name {
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        audio {
            width: 100%;
            margin: 25px 0;
            height: 50px;
            border-radius: 10px;
            background: #f0f0f0;
        }

        audio::-webkit-media-controls-panel {
            background-color: #f0f0f0;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 100px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        button.active {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .volume-control {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .volume-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            color: #333;
            margin-bottom: 10px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }

        .info-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }

        .status {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
        }

        .time-display {
            color: #666;
            font-size: 13px;
            margin-top: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            margin: 10px 0;
            overflow: hidden;
            cursor: pointer;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.1s linear;
        }

        .feature-list {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid #e0e0e0;
        }

        .feature-list h3 {
            color: #333;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .feature-list ul {
            list-style: none;
            color: #666;
            font-size: 13px;
        }

        .feature-list li {
            padding: 5px 0;
        }

        .feature-list li:before {
            content: "✓ ";
            color: #667eea;
            font-weight: bold;
            margin-right: 8px;
        }

        @media (max-width: 480px) {
            .player-container {
                padding: 25px;
            }

            h1 {
                font-size: 26px;
            }

            .controls {
                gap: 10px;
            }

            button {
                min-width: 80px;
                padding: 12px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="header">
            <h1>🎵 Music Player</h1>
            <p class="song-name">Ee Hridayam - Background Music</p>
        </div>

        <!-- Audio Player -->
        <audio id="backgroundAudio" crossorigin="anonymous">
            <source src="https://raw.githubusercontent.com/karthiiiik14-jpg/me--her/main/Ee%20Hridayam%20-%20NaaSongsHD.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <!-- Progress Bar -->
        <div class="progress-bar">
            <div class="progress" id="progressBar"></div>
        </div>

        <!-- Control Buttons -->
        <div class="controls">
            <button id="playBtn" onclick="playAudio()" title="Play music">
                ▶ Play
            </button>
            <button id="pauseBtn" onclick="pauseAudio()" title="Pause music">
                ⏸ Pause
            </button>
            <button id="loopBtn" onclick="toggleLoop()" title="Toggle loop" data-loop="false">
                🔁 Loop: OFF
            </button>
        </div>

        <!-- Volume Control -->
        <div class="volume-control">
            <div class="volume-label">
                🔊 Volume: <span id="volumeValue">70</span>%
            </div>
            <input type="range" id="volumeControl" min="0" max="100" value="70" onchange="setVolume(this.value)" oninput="setVolume(this.value)">
        </div>

        <!-- Info Section -->
        <div class="info-section">
            <div class="status" id="status">⏹ Ready to play</div>
            <div class="time-display">
                <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
            </div>
        </div>

        <!-- Features -->
        <div class="feature-list">
            <h3>Features</h3>
            <ul>
                <li>Works on desktop & mobile browsers</li>
                <li>Play, pause & loop controls</li>
                <li>Volume adjustment</li>
                <li>Progress tracking</li>
                <li>No installation required</li>
            </ul>
        </div>
    </div>

    <script>
        const audio = document.getElementById('backgroundAudio');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const loopBtn = document.getElementById('loopBtn');
        const progressBar = document.getElementById('progressBar');
        const volumeControl = document.getElementById('volumeControl');
        const volumeValue = document.getElementById('volumeValue');
        const status = document.getElementById('status');
        const currentTimeDisplay = document.getElementById('currentTime');
        const durationDisplay = document.getElementById('duration');
        let isLooping = false;

        // Play Audio
        function playAudio() {
            audio.play().catch(error => {
                console.error('Play error:', error);
                status.textContent = '❌ Error playing audio';
            });
            status.textContent = '▶️ Now Playing';
            playBtn.style.opacity = '0.6';
            pauseBtn.style.opacity = '1';
        }

        // Pause Audio
        function pauseAudio() {
            audio.pause();
            status.textContent = '⏸️ Paused';
            playBtn.style.opacity = '1';
            pauseBtn.style.opacity = '0.6';
        }

        // Toggle Loop
        function toggleLoop() {
            isLooping = !isLooping;
            audio.loop = isLooping;
            loopBtn.textContent = isLooping ? '🔁 Loop: ON' : '🔁 Loop: OFF';
            loopBtn.setAttribute('data-loop', isLooping);
            loopBtn.classList.toggle('active', isLooping);
        }

        // Set Volume
        function setVolume(value) {
            audio.volume = value / 100;
            volumeValue.textContent = value;
        }

        // Update Progress Bar
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percentage = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percentage + '%';
                currentTimeDisplay.textContent = formatTime(audio.currentTime);
            }
        });

        // Update Duration
        audio.addEventListener('loadedmetadata', () => {
            durationDisplay.textContent = formatTime(audio.duration);
        });

        // Format Time
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Audio Ended
        audio.addEventListener('ended', () => {
            if (!isLooping) {
                status.textContent = '✓ Finished';
                playBtn.style.opacity = '1';
                pauseBtn.style.opacity = '0.6';
                progressBar.style.width = '0%';
            }
        });

        // Click on Progress Bar to Seek
        document.querySelector('.progress-bar').addEventListener('click', (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const percentage = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percentage * audio.duration;
        });

        // Initialize Volume
        setVolume(volumeControl.value);

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (audio.paused) {
                    playAudio();
                } else {
                    pauseAudio();
                }
            }
        });

        // Initial State
        playBtn.style.opacity = '1';
        pauseBtn.style.opacity = '0.6';
    </script>
</body>
</html>
