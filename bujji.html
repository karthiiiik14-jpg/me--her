<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For My Bujji</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", Arial, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #ffb6c1 0, #000 55%);
      z-index: -2;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: -1;
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.4rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.4rem;
      font-weight: 400;
      margin-bottom: 25px;
    }

    .image-frame {
      width: 80vw;
      max-width: 500px;
      height: 60vh;
      max-height: 420px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(255, 182, 193, 0.7);
      position: relative;
      background: #111;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .letter-text {
      position: absolute;
      inset: 0;
      padding: 18px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      text-align: left;
      background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0.1));
      font-size: 0.9rem;
      line-height: 1.4;
      white-space: pre-line;
    }

    .controls {
      margin-top: 18px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .heart {
      color: #ffb6c1;
    }
  </style>
</head>
<body>
  <!-- Background audio (auto-play, loop) -->
  <audio src="https://github.com/karthiiiik14-jpg/me--her/raw/main/WhatsApp%20Audio%202026-08-31%20at%2011.28.59%20AM%20(2).mpeg"
         autoplay
         loop>
    Your browser does not support the audio element.
  </audio>

  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="container">
    <h1>Happy Birthday, Bujji</h1>
    <h2>From the boy who always chose you <span class="heart">♥</span></h2>

    <div class="image-frame">
      <img id="slideImage" src="" alt="Us">
      <div class="letter-text" id="slideText"></div>
    </div>

    <div class="controls">
      Picture <span id="slideIndex">1</span> / <span id="slideTotal">10</span> ·
      Made with love by Karthik
    </div>
  </div>

  <script>
    // 1) Add your 10 image URLs here
    // Replace [filename] with your actual file names (e.g. 1.jpg, photo1.jpeg, etc.)
    const images = [
      "https://github.com/karthiiiik14-jpg/me--her/raw/main/1.jpg",
      "https://github.com/karthiiiik14-jpg/me--her/raw/main/2.jpg",
      "https://github.com/karthiiiik14-jpg/me--her/raw/main/3.jpg",
      "https://github.com/karthiiiik14-jpg/me--her/raw/main/4.jpg",
      "https://github.com/karthiiiik14-jpg/me--her/raw/main/5.jpg",
      "https://github.com/karthiiiik14-jpg/me--her/raw/main/6.jpg",
      "https://github.com/karthiiiik14-jpg/me--her/raw/main/7.jpg",
      "https://github.com/karthiiiik14-jpg/me--her/raw/main/8.jpg",
      "https://github.com/karthiiiik14-jpg/me--her/raw/main/9.jpg",
      "https://github.com/karthiiiik14-jpg/me--her/raw/main/10.jpg"
    ];

    // 2) Text from your two letters, split across 10 slides
    const texts = [
`Hi Bujii,

Happy Birthday. I dreamt many years ago that this moment would come. When I first saw you at university, I felt you were my future wife.`,
`It started on May 21st and it continues. I love you so much. I know you got hurt, and I am truly sorry.`,
`Still, I love you so much. I don’t know how to tell everything. I know how many papers I wasted trying to explain my feelings.`,
`I filled you in every inch of my heart. I think about you always. I wait for your call. I pray to God to give you to me.`,
`Don’t laugh at my grammar mistakes. When I see you, my heart is full of joy. When you finish your lunch, I feel disappointed because I want more time with you.`,
`I want to tell you: eat slowly, speak with me some more time. I am dying here to talk with you, but I stop myself.`,
`Please give me a chance, Bujji. Don’t think I am begging. I love you so much. I will never disappoint you.`,
`I will be loyal to you. I will always speak the truth. You are my choice in everything. We will build a life together.`,
`We will grow together. I want to be with you every time, to see you, to listen to you. I pray to God every day to give you some feelings for me.`,
`I love you, Bujji. Please give me a chance, my heroine. Happy Birthday, Bujji.

Don’t think I am too mature—my inner child wrote this.

Karthik`
    ];

    const imgEl = document.getElementById("slideImage");
    const textEl = document.getElementById("slideText");
    const indexEl = document.getElementById("slideIndex");
    const totalEl = document.getElementById("slideTotal");

    let current = 0;
    totalEl.textContent = images.length;

    function showSlide(i) {
      current = i % images.length;
      imgEl.src = images[current];
      textEl.textContent = texts[current] || "";
      indexEl.textContent = current + 1;
    }

    // Change slide every 10 seconds
    showSlide(0);
    setInterval(() => {
      showSlide(current + 1);
    }, 10000);
  </script>
</body>
</html>
